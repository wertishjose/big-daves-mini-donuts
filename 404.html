<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function redirectGitHubPagesRoute() {
        const pathSegmentsToKeep = 1;
        const { location } = window;
        const basePath = location.pathname
          .split("/")
          .slice(0, 1 + pathSegmentsToKeep)
          .join("/");
        const routePath = location.pathname
          .slice(1)
          .split("/")
          .slice(pathSegmentsToKeep)
          .join("/");
        const search = location.search ? `&${location.search.slice(1).replace(/&/g, "~and~")}` : "";

        location.replace(
          `${location.protocol}//${location.hostname}${location.port ? `:${location.port}` : ""}${basePath}/?p=/${routePath}${search}${location.hash}`,
        );
      })();
    </script>
  </head>
  <body></body>
</html>
